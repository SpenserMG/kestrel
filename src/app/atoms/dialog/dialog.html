<div class="flex items-center justify-between gap-4" mat-dialog-title>
  <span>{{ title() }}</span>
  <app-icon-button icon="x" label="Close dialog" (pressed)="close()" />
</div>
<mat-dialog-content>
  <ng-content />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <ng-content select="[appDialogActions]" />
</mat-dialog-actions>
