<ng-template #cardBody>
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ title() }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <ng-content />
    </mat-card-content>
    <mat-card-actions align="end">
      @if (primaryButtonText()) {
        <button matButton="text">{{ primaryButtonText() }}</button>
      }
    </mat-card-actions>
  </mat-card>
</ng-template>

@if (link(); as link) {
  <a class="card-link" [routerLink]="link">
    <ng-container [ngTemplateOutlet]="cardBody" />
  </a>
} @else {
  <ng-container [ngTemplateOutlet]="cardBody" />
}
