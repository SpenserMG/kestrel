<div class="flex h-screen flex-col">
  <app-header />
  <mat-sidenav-container class="flex-1">
    <mat-sidenav
      class="app-sidenav"
      [mode]="sidenavMode()"
      opened
      [style.--mat-sidenav-container-width]="navWidth()"
    >
      <div class="flex justify-end p-1">
        <app-icon-button
          [icon]="navCollapsed() ? 'chevron_right' : 'chevron_left'"
          [label]="navCollapsed() ? 'Expand navigation' : 'Collapse navigation'"
          (pressed)="toggleNav()"
        />
      </div>
      <mat-nav-list>
        <a mat-list-item routerLink="/home">
          <app-icon [class.hidden]="!navCollapsed()" matListItemIcon name="home" />
          <span class="flex justify-center" [class.sr-only]="navCollapsed()">Home</span>
        </a>
        <a mat-list-item routerLink="/games">
          <app-icon [class.hidden]="!navCollapsed()" matListItemIcon name="stadia_controller" />
          <span class="flex justify-center" [class.sr-only]="navCollapsed()">Games</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content [style.margin-left]="contentMargin()">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
