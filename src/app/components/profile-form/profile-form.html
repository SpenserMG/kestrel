<app-dialog title="Edit profile">
  <div class="flex flex-col gap-4">
    <app-text-field
      label="Display name"
      [formField]="profileForm.displayName"
      [errorMessage]="displayNameError()"
    />
    <app-select label="Favorite game" [options]="favoriteGameOptions" [formField]="profileForm.favoriteGame" />
    <app-toggle label="Email me about new high scores" [formField]="profileForm.notifyOnHighScores" />
  </div>
  <div appDialogActions class="flex gap-2">
    <app-button variant="text" label="Cancel" (pressed)="cancel()" />
    <app-button label="Save" (pressed)="save()" />
  </div>
</app-dialog>
