<div class="mx-auto flex max-w-3xl flex-col gap-4 p-4">
  <h1>Games</h1>

  @if (favoriteGame(); as favorite) {
    <section class="flex flex-col gap-2">
      <h2>Favorite Game</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3">
        <app-card [title]="favorite.title" [link]="favorite.link" primaryButtonText="Go">
          {{ favorite.description }}
        </app-card>
      </div>
    </section>

    <app-divider class="my-4" />
  }

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3">
    @for (game of games; track game.id) {
      <app-card [title]="game.title" [link]="game.link" primaryButtonText="Go">
        {{ game.description }}
      </app-card>
    }
  </div>
</div>
